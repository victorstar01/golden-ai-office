<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f0e8"><title>황금비서 AI 오피스 · 미니어처</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#342e36;background:#f7f0e8}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:20px 15px 55px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:21px;margin:0}small{color:#7d7481}.status{background:#dff7e6;color:#287746;border-radius:30px;padding:8px 11px;font-size:12px}.intro{margin:10px 0 20px;color:#706773;font-size:14px}.scene{position:relative;overflow:hidden;border:5px solid white;border-radius:26px;box-shadow:0 14px 32px #65514622;background:linear-gradient(145deg,#d7e6f7 0 50%,#f7dec1 50%);padding:25px 10px 22px}.scene:before{content:"";position:absolute;inset:9px;border:2px dashed #ffffff90;border-radius:18px;pointer-events:none}.sign{text-align:center;font-size:13px;font-weight:800;letter-spacing:2px;margin-bottom:19px;color:#776077}.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 12px;position:relative}.room{border:0;background:linear-gradient(150deg,#fffaf5,#eae4ed);border-radius:17px;min-height:165px;padding:13px 5px 12px;box-shadow:0 9px 0 #ae927d,0 13px 15px #6d5c5a30;position:relative;cursor:pointer;color:inherit;transition:transform .15s}.room:active{transform:translateY(4px)}.room.selected{outline:3px solid #7a6afa}.desk{position:relative;height:92px;margin:auto;width:120px;max-width:95%;filter:drop-shadow(0 6px 3px #9b837b44)}.tabletop{position:absolute;left:13%;top:48%;width:74%;height:35%;background:#c9956f;border-radius:8px;transform:skewY(-8deg);box-shadow:0 9px 0 #946b55}.monitor{position:absolute;left:33%;top:22%;width:40%;height:36%;background:#55506a;border:5px solid #e6e1ee;border-radius:7px;transform:skewY(-7deg);box-shadow:2px 3px 0 #938ca2}.monitor:after{content:"";position:absolute;inset:4px;background:linear-gradient(130deg,#a7e5f6,#a79bff);border-radius:2px}.head{position:absolute;z-index:2;left:3%;top:14%;font-size:36px;animation:bob 3s ease-in-out infinite}.plant{position:absolute;right:2%;top:44%;font-size:25px}.room:nth-child(2) .head{animation-delay:.5s}.room:nth-child(3) .head{animation-delay:1s}.room:nth-child(4) .head{animation-delay:1.5s}.room:nth-child(5) .head{animation-delay:2s}.room:nth-child(6) .head{animation-delay:2.5s}@keyframes bob{50%{transform:translateY(-5px) rotate(3deg)}}.name{font-weight:800;font-size:14px;margin-top:4px}.desc{font-size:11px;color:#817580;margin-top:4px}.pill{position:absolute;top:8px;right:8px;background:#e4f6e9;color:#358154;font-size:10px;padding:4px 7px;border-radius:12px}.panel{background:white;border-radius:22px;padding:21px 18px;margin-top:22px;box-shadow:0 8px 28px #665e6020}h2{font-size:19px;margin:0 0 8px}.hint{font-size:13px;color:#766f7b;line-height:1.65}.selected-title{color:#6654c7;font-weight:800}.field{display:block;font-size:13px;font-weight:700;margin:16px 0 8px}textarea{width:100%;min-height:112px;border:1px solid #ddd8e4;border-radius:13px;padding:13px;font:inherit;font-size:14px;resize:vertical}button.action{border:0;background:#6554eb;color:white;font-weight:800;border-radius:12px;padding:15px;width:100%;font-size:14px;margin-top:12px;cursor:pointer}.secondary{background:#eeeafc!important;color:#5545bd!important}.output{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f2fc;padding:14px;border-radius:12px;margin-top:14px;font-size:13px;line-height:1.6}.hide{display:none}.note{text-align:center;color:#827b86;font-size:11px;margin-top:17px;line-height:1.6}@media(min-width:650px){.rooms{grid-template-columns:repeat(3,1fr)}.room{min-height:184px}.desk{height:105px}}
</style></head><body><main><header><div><h1>🏢 황금비서 AI 오피스</h1><small>나만의 미니어처 콘텐츠 제작 사무실 · v2</small></div><span class="status">● 운영 준비</span></header><p class="intro">책상에서 일하는 직원 6명을 터치해 업무를 맡겨보세요 ✨</p><section class="scene" aria-label="미니어처 AI 사무실"><div class="sign">✦ GOLDEN AI OFFICE ✦</div><div class="rooms" id="rooms"></div></section><section class="panel"><h2 id="heading">직원을 선택하세요 👆</h2><div class="hint" id="help">위 미니어처 사무실에서 직원을 터치하면 담당 업무를 선택할 수 있어요.</div><label class="field" for="task">업무 내용</label><textarea id="task" placeholder="예: 무선 청소기 상품 이미지 분석 후 쇼츠 대본 만들어줘"></textarea><button class="action" id="make">업무 요청서 만들기</button><div id="result" class="output hide"></div><button class="action secondary hide" id="copy">요청서 복사하기</button><button class="action secondary hide" id="chat">ChatGPT에서 업무 진행하기 ↗</button></section><p class="note">현재는 업무 요청서 제작 체험판입니다.<br>실제 AI 자동 답변·자동 게시 기능은 아직 연결되지 않았습니다.</p></main><script>
const staff=[['🔎','상품 발굴팀','추천 상품 조사','상품 특징, 타깃 고객, 경쟁력, 확인해야 할 가격·수수료·판매 조건을 정리해줘.'],['✍️','블로그팀','검색 유입 글 작성','네이버 블로그용 SEO 제목 5개와 모바일 가독성 좋은 본문 초안을 작성해줘.'],['🎬','쇼츠팀','10초·30초 대본','후킹→문제 해결→장점 2개→CTA 구조로 쇼츠 대본과 캡션을 작성해줘.'],['📱','SNS팀','스레드·인스타 문구','스레드용 친근한 글과 인스타그램 캡션, 해시태그를 작성해줘.'],['🎨','디자인팀','썸네일 기획','원본 상품 외형을 변경하지 않는 썸네일 및 콘텐츠 이미지 콘셉트를 기획해줘.'],['📊','분석팀','실적 분석','제공된 조회수·클릭·판매·수수료 데이터를 분석하고 개선 우선순위를 제안해줘.']];let current=-1,last='';const rooms=document.getElementById('rooms');staff.forEach((s,i)=>{let b=document.createElement('button');b.className='room';b.type='button';b.innerHTML=`<span class="pill">업무 대기</span><div class="desk"><div class="tabletop"></div><div class="monitor"></div><span class="head">${['🧑🏻‍💻','👩🏻‍💻','🧑🏽‍🎨','👩🏽‍💼','🧑🏼‍🎨','👨🏻‍💻'][i]}</span><span class="plant">${['🌱','📚','🎥','📱','🎨','📈'][i]}</span></div><div class="name">${s[0]} ${s[1]}</div><div class="desc">${s[2]}</div>`;b.onclick=()=>{current=i;document.querySelectorAll('.room').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('heading').textContent=s[0]+' '+s[1];document.getElementById('help').textContent=s[2]+' 담당 직원입니다. 아래에 업무를 적어주세요.';document.getElementById('result').classList.add('hide');document.getElementById('copy').classList.add('hide');document.getElementById('chat').classList.add('hide');document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'nearest'});};rooms.appendChild(b)});document.getElementById('make').onclick=()=>{if(current<0){alert('먼저 직원을 선택해 주세요.');return}let t=document.getElementById('task').value.trim();if(!t){alert('업무 내용을 입력해 주세요.');return}let s=staff[current];last=`너는 황금비서 AI 오피스의 ${s[1]} 전문 직원이야.\n담당 업무: ${s[3]}\n\n사용자 요청:\n${t}\n\n중요: 확인되지 않은 가격·배송·수수료·상품 정보는 만들어내지 마. 사용하지 않은 제품을 직접 사용했다고 쓰지 마. 저작권과 제휴 표시를 지켜줘. 결과는 한국어로 실무에 바로 쓸 수 있게 작성해줘.`;document.getElementById('result').textContent=last;['result','copy','chat'].forEach(id=>document.getElementById(id).classList.remove('hide'))};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(last);alert('복사했어요!')}catch(e){let ta=document.createElement('textarea');ta.value=last;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('복사했어요!')}};document.getElementById('chat').onclick=()=>{window.open('https://chatgpt.com/','_blank','noopener')};
</script></body></html>
