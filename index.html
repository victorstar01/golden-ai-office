<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>황금비서 AI 오피스</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:#f2f4fa;color:#1c2940}.wrap{max-width:680px;margin:auto;padding:22px 15px 40px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}p{color:#637089}.tag{background:#e6f6ed;color:#16844c;border-radius:20px;padding:7px 11px;font-size:12px}.room{background:linear-gradient(145deg,#dceafa 0 44%,#f2d9b7 44%);border:7px solid white;border-radius:25px;box-shadow:0 14px 35px #24365322;padding:25px 12px;transform:perspective(800px) rotateX(7deg);margin:28px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.desk{border:2px solid #ffffffa8;border-radius:18px;background:#ffffffb9;padding:15px 5px;text-align:center;box-shadow:0 9px 0 #b99d7b,0 12px 12px #0002;cursor:pointer;color:#24344c}.person{font-size:49px;display:block;filter:drop-shadow(0 5px 2px #0002)}.desk strong{display:block;margin:6px 0}.desk small{font-size:11px;color:#68758b}.panel{background:white;padding:20px;border-radius:20px;box-shadow:0 8px 24px #24365312}textarea{width:100%;height:100px;border:1px solid #ccd5e5;border-radius:12px;padding:12px;font:inherit;resize:vertical}button.action{width:100%;border:0;background:#3267ec;color:white;padding:13px;border-radius:12px;font-size:15px;font-weight:700;margin-top:10px}#output{white-space:pre-wrap;background:#f3f6fc;border-radius:12px;padding:12px;font-size:13px;margin-top:12px;display:none}footer{text-align:center;color:#8390a5;font-size:12px;margin-top:20px}</style></head><body><main class="wrap"><header><div><h1>🏢 황금비서 AI 오피스</h1><p>나만의 쇼핑 콘텐츠 제작 사무실</p></div><span class="tag">● 운영 준비</span></header><section class="room"><div class="grid" id="staff"></div></section><section class="panel"><h2 id="title">직원을 선택하세요</h2><p id="description">사무실에서 직원을 터치하면 업무를 시작할 수 있어요.</p><textarea id="input" placeholder="상품명, 특징, 링크 또는 작업 내용을 입력하세요"></textarea><button class="action" id="make">업무 요청서 만들기</button><div id="output"></div><button class="action" style="background:#25354c" id="copy" hidden>요청서 복사하기</button></section><footer>1단계 체험판 · 실제 AI 자동 실행은 다음 단계에서 연결합니다.</footer></main><script>const people=[['🔎','상품 발굴팀','추천 상품 후보 조사','상품 카테고리와 타깃 고객을 바탕으로 상품 후보 선정 기준, 검증할 정보, 검색어를 제안해줘.'],['✍️','블로그팀','검색 유입 글 작성','제공된 사실만 사용해 네이버 블로그용 SEO 글의 제목과 소제목 5개, 본문 초안을 작성해줘.'],['🎬','쇼츠팀','10초·30초 대본','제공된 상품 정보로 후킹, 문제해결, 장점 2개, CTA 구조의 쇼츠 대본과 캡션을 작성해줘.'],['📱','SNS팀','스레드·인스타 문구','스레드와 인스타그램에 어울리는 자연스러운 홍보 글과 해시태그를 작성해줘.'],['🎨','디자인팀','썸네일 기획','실제 상품 외형을 변경하지 않는 썸네일과 본문 이미지 구성안을 제안해줘.'],['📊','분석팀','실적 분석','제공된 조회수, 클릭수, 주문수, 수익 데이터를 분석하고 개선 우선순위를 정해줘.']];let selected=-1;const staff=document.getElementById('staff');people.forEach((p,i)=>{const b=document.createElement('button');b.className='desk';b.innerHTML=`<span class="person">${p[0]}</span><strong>${p[1]}</strong><small>${p[2]}</small>`;b.onclick=()=>{selected=i;document.getElementById('title').textContent=p[0]+' '+p[1];document.getElementById('description').textContent=p[2]+' 담당 직원입니다. 아래에 요청 내용을 입력하세요.';document.getElementById('output').style.display='none';document.getElementById('copy').hidden=true;document.querySelectorAll('.desk').forEach(x=>x.style.outline='none');b.style.outline='3px solid #3267ec'};staff.appendChild(b)});let last='';document.getElementById('make').onclick=()=>{if(selected<0){alert('먼저 직원을 선택하세요.');return}const value=document.getElementById('input').value.trim();if(!value){alert('요청 내용을 입력하세요.');return}last=`너는 황금비서 AI 오피스의 ${people[selected][1]} 담당자야.\n업무: ${people[selected][3]}\n\n사용자 입력:\n${value}\n\n확인되지 않은 가격·배송·판매 실적은 만들지 말고, 제휴 광고 표시와 이미지 이용 권한을 확인하도록 안내해줘.`;const o=document.getElementById('output');o.textContent=last;o.style.display='block';document.getElementById('copy').hidden=false};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(last);alert('복사했어요. ChatGPT에 붙여넣으세요.')}catch(e){alert('복사가 지원되지 않으면 요청서 내용을 길게 눌러 복사하세요.')}};</script></body></html>
