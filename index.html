<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5e9dc"><title>황금비서 AI 오피스 v3</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:linear-gradient(#f5e9dc,#edf1fc);color:#302d38}.wrap{max-width:820px;margin:auto;padding:18px 14px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:21px;margin:0}small{color:#746c79}.pill{background:#d9f4df;border-radius:40px;padding:7px 10px;font-size:12px;color:#24643b}.intro{margin:18px 0 12px}.office{border:7px solid white;border-radius:26px;padding:16px;background:linear-gradient(145deg,#d8e8fa 0 52%,#f6dbb8 52%);box-shadow:0 14px 30px #7b625a35}.sign{text-align:center;font-size:12px;letter-spacing:3px;color:#786a85;margin:0 0 14px}.team{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.worker{border:2px solid #fff;border-radius:19px;background:#ffffffcc;box-shadow:0 7px 0 #b79b86,0 10px 15px #69554b30;padding:14px 6px 17px;text-align:center;color:inherit;cursor:pointer;min-height:146px}.worker.active{outline:3px solid #7457eb;background:#fff}.scene{height:65px;position:relative;display:flex;justify-content:center;align-items:flex-start}.avatar{font-size:36px;position:relative;z-index:1;animation:bob 3s ease-in-out infinite}.desk{position:absolute;bottom:1px;left:22%;right:22%;height:25px;border-radius:8px;background:#a97758;box-shadow:0 5px 0 #82573f}.screen{position:absolute;bottom:19px;left:51%;font-size:29px;z-index:2}.worker strong{display:block;font-size:14px}.worker small{font-size:11px}@keyframes bob{50%{transform:translateY(-3px)}}section{background:white;border-radius:23px;padding:18px;margin-top:23px;box-shadow:0 9px 22px #61566b12}h2{font-size:18px;margin:0 0 8px}label{display:block;font-size:13px;font-weight:700;margin:13px 0 7px}textarea{width:100%;min-height:120px;border:1px solid #d7d4df;border-radius:12px;padding:13px;font:inherit;resize:vertical}button.action,a.action{display:block;width:100%;border:0;border-radius:12px;background:#6754e8;color:white;padding:15px;font-weight:750;font-size:15px;text-align:center;text-decoration:none;margin-top:11px;cursor:pointer}.secondary{background:#e9e5ff!important;color:#4933a5!important}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f6fb;border-radius:12px;padding:14px;font-size:13px;max-height:350px;overflow:auto;margin-top:12px}footer{text-align:center;font-size:12px;color:#777;margin-top:20px}.hidden{display:none}@media(min-width:640px){.team{grid-template-columns:repeat(3,1fr)}.worker{min-height:165px}}</style></head><body><main class="wrap"><header><div><h1>🏢 황금비서 AI 오피스</h1><small>나만의 미니어처 콘텐츠 제작 사무실 · v3</small></div><span class="pill">● 운영 준비</span></header><p class="intro">책상에서 일하는 직원 6명을 터치해 업무를 맡겨보세요 ✨</p><div class="office"><p class="sign">✦ GOLDEN AI OFFICE ✦</p><div class="team" id="team"></div></div><section><h2 id="selected">직원을 선택하세요 👆</h2><small id="description">직원을 터치하면 해당 업무에 맞춘 전문 지침이 준비됩니다.</small><label for="task">업무 내용</label><textarea id="task" placeholder="예: 장난감 자동차 상품 이미지 분석 후 30초 쇼츠 대본과 캡션 만들어줘"></textarea><button class="action" id="make">전문 업무 요청서 만들기</button><div id="outputArea" class="hidden"><div class="result" id="output"></div><button class="action secondary" id="copy">① 업무 요청서 복사</button><a class="action" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">② ChatGPT 열기</a><small>ChatGPT가 열리면 입력창을 길게 눌러 붙여넣고 전송하세요. 자동 전송되지 않습니다.</small></div></section><footer>무료 수동 연결 버전 · 상품 정보와 정책은 게시 전에 직접 확인하세요.</footer></main><script>
const staff=[
{name:'상품 발굴팀',icon:'🕵🏻',emoji:'🔎',sub:'추천 상품 조사',desc:'상품 특징, 대상 고객, 차별점, 판매 전략을 분석합니다.',prompt:'너는 네이버 쇼핑커넥트 및 크리에이터샵 상품 분석 전문가다. 제공된 상품 정보만 근거로 특징, 타깃 고객, 구매 포인트, 검색 키워드 10개, 추천 콘텐츠 아이디어 5개, 확인할 위험요소를 정리해라. 가격·수수료·판매량·배송은 추측하지 말고 확인 필요라고 표시해라.'},
{name:'블로그팀',icon:'👩🏻‍💻',emoji:'✍️',sub:'검색 유입 글 작성',desc:'검색 의도와 모바일 가독성을 고려한 블로그 초안을 만듭니다.',prompt:'너는 네이버 블로그 SEO 콘텐츠 작가다. 친근한 존댓말과 짧은 문단으로 검색 의도에 맞는 제목 5개, 도입, 소제목 5개, 본문, FAQ, 마무리를 작성해라. 확인되지 않은 사용 경험을 꾸며내지 말고 상품 정보와 출처를 구분해라. 제휴 광고 표시 규정 준수를 안내해라.'},
{name:'쇼츠팀',icon:'👨🏽‍💻',emoji:'🎬',sub:'10초·30초 대본',desc:'쇼츠 후킹·대본·자막·캡션을 설계합니다.',prompt:'너는 한국어 쇼핑 숏폼 기획자다. 요청한 길이에 맞춰 후킹→문제 해결→장점 2개→구매 유도 순서로 시간대별 대본, 화면 구성, 자막, 캡션을 만들어라. 제품 외형과 성능을 임의로 바꾸지 말고 배송 보장은 확인된 경우에만 표현해라. 이미지·영상 사용 권한을 확인하도록 안내해라.'},
{name:'SNS팀',icon:'👩🏽',emoji:'📱',sub:'스레드·인스타 문구',desc:'채널별 홍보 문구와 CTA를 만듭니다.',prompt:'너는 스레드·인스타그램 콘텐츠 마케터다. 자연스러운 일상형 스레드 글 2개, 인스타 캡션 1개, 해시태그, 클릭 유도 문구를 작성해라. 과장된 후기나 허위 할인·긴급성 표현을 피하고 경제적 이해관계 표시가 필요한지 안내해라.'},
{name:'디자인팀',icon:'🧑🏼‍🎨',emoji:'🎨',sub:'썸네일 기획',desc:'이미지 구성과 생성용 프롬프트를 작성합니다.',prompt:'너는 상품 콘텐츠 디자인 디렉터다. 사용자가 제공한 실제 상품 이미지의 색상·형태·로고를 변형하지 않는 방향으로 썸네일과 본문 이미지 기획안, 이미지 생성 프롬프트를 작성해라. 사용 허락을 확인하지 않은 판매자 이미지는 재사용 가능하다고 단정하지 마라. 실사진을 우선하고 AI 이미지는 구분해라.'},
{name:'분석팀',icon:'👨🏻‍💼',emoji:'📊',sub:'실적 분석',desc:'조회수·클릭·판매 데이터를 비교합니다.',prompt:'너는 콘텐츠 커머스 데이터 분석가다. 사용자가 제공한 날짜별 조회수·클릭수·주문수·수익을 표로 정리하고 계산 가능한 CTR·전환율·상품별 성과를 분석해라. 없는 숫자는 만들어내지 말고 데이터가 부족하면 필요한 항목을 질문해라. 다음 주 개선 실험 3개를 제안해라.'}
];let current=-1;const team=document.getElementById('team'),outputArea=document.getElementById('outputArea');staff.forEach((s,i)=>{const b=document.createElement('button');b.className='worker';b.type='button';b.innerHTML=`<div class="scene"><span class="avatar">${s.icon}</span><span class="desk"></span><span class="screen">🖥️</span></div><strong>${s.emoji} ${s.name}</strong><small>${s.sub}</small>`;b.addEventListener('click',()=>{current=i;document.querySelectorAll('.worker').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('selected').textContent=s.emoji+' '+s.name;document.getElementById('description').textContent=s.desc;outputArea.classList.add('hidden');document.getElementById('task').focus()});team.appendChild(b)});
document.getElementById('make').onclick=()=>{if(current<0){alert('먼저 직원을 선택하세요.');return}const task=document.getElementById('task').value.trim();if(!task){alert('업무 내용을 입력하세요.');return}document.getElementById('output').textContent=staff[current].prompt+'\n\n[사용자 업무 요청]\n'+task+'\n\n[출력 규칙]\n한국어로 바로 실행 가능한 결과를 작성하고, 확인되지 않은 사실은 추측하지 마세요.';outputArea.classList.remove('hidden');outputArea.scrollIntoView({behavior:'smooth',block:'nearest'})};document.getElementById('copy').onclick=async()=>{const t=document.getElementById('output').textContent;try{await navigator.clipboard.writeText(t);alert('복사했어요! ChatGPT에 붙여넣으세요.')}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('output'));const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);alert('텍스트를 선택했어요. 복사 메뉴를 눌러주세요.')}};
</script></body></html>
